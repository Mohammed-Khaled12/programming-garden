CODE.heap=`public void heapify(int[] arr, int n, int root) {
    int largest = root;

    int r = 2 * root + 2;
    if (l < n && arr[l] > arr[largest]) largest = l;
    if (r < n && arr[r] > arr[largest]) largest = r;
    if (largest != root) {

        arr[root] = arr[largest];
        arr[largest] = temp;
        heapify(arr, n, largest);
    }

    for (int i = (n / 2) - 1; i >= 0; i--) {
        heapify(arr, n, i);
    }

CODE.counting=`public void countingSort(int[] arr) {
    if (arr == null || arr.length <= 1) return;
    int n = arr.length;
    int max = arr[0];
    for (int i = 1; i < n; i++) {
        if (arr[i] > max) max = arr[i];
    }
    int[] count = new int[max + 1];
    for (int i = 0; i < n; i++) {
        count[arr[i]]++;
    }
    for (int i = 1; i <= max; i++) {
        count[i] += count[i - 1];
    }
    int[] output = new int[n];
    for (int i = n - 1; i >= 0; i--) {
        int currentNumber = arr[i];
        int position = count[currentNumber] - 1;
        output[position] = currentNumber;
        count[currentNumber]--;
    }
    for (int i = 0; i < n; i++) {
        arr[i] = output[i];
    }
